const cards=document.getElementById('cards'),empty=document.getElementById('empty'),count=document.getElementById('count'),search=document.getElementById('search');let city='all',lang='all';let favs=new Set(JSON.parse(localStorage.getItem('thaiFavs')||'[]'));function render(){const q=search.value.toLowerCase().trim();const list=tours.filter(t=>(city==='all'||t.city===city)&&(lang==='all'||(lang==='fav'?favs.has(t.id):t.lang===lang))&&(!q||(t.title+' '+t.desc+' '+t.place+' '+t.tags.join(' ')).toLowerCase().includes(q)));cards.innerHTML=list.map(t=>`<article class="card"><div class="accent"></div><button class="fav ${favs.has(t.id)?'on':''}" data-fav="${t.id}" aria-label="Favorito">${favs.has(t.id)?'♥':'♡'}</button><div class="body"><div class="city">${t.place}</div><div class="title">${t.title}</div><div class="desc">${t.desc}</div><div class="chips">${t.tags.map(x=>`<span class="chip ${x.includes('Español')?'es':x.includes('Inglés')||x.includes('Sin inglés')?'easy':x.includes('TOP')?'top':''}">${x}</span>`).join('')}</div>${t.price?`<div class="price"><div class="priceBox"><small>PRECIO APROX.</small><b>${t.price}</b></div>${t.total?`<div class="priceBox"><small>LOS 3</small><b>${t.total}</b></div>`:''}</div>`:''}<div class="actions"><a class="web" target="_blank" href="${t.web}">🌐 Ver opción</a><a class="maps" target="_blank" href="${t.maps}">🗺️ Maps</a></div></div></article>`).join('');count.textContent=`${list.length} excursiones`;empty.style.display=list.length?'none':'block';document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{favs.has(b.dataset.fav)?favs.delete(b.dataset.fav):favs.add(b.dataset.fav);localStorage.setItem('thaiFavs',JSON.stringify([...favs]));render()})}document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-city]').forEach(x=>x.classList.remove('on'));b.classList.add('on');city=b.dataset.city;render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-lang]').forEach(x=>x.classList.remove('on'));b.classList.add('on');lang=b.dataset.lang;render()});search.addEventListener('input',render);document.getElementById('topBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});render();</script></body></html>
