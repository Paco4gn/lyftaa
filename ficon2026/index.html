<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FICON 2026 · Control técnico</title><style>:root{font-family:system-ui;background:#0b1525;color:#eaf1fa}*{box-sizing:border-box}body{margin:0}header{background:#13263d;padding:22px max(16px,calc((100vw - 1100px)/2));border-bottom:2px solid #3cc6d6}h1{margin:0;font-size:26px}small,.muted{color:#9eb2c9}main{max-width:1100px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;margin:15px 0}button,select,input,textarea{font:inherit;border-radius:8px;border:1px solid #415673;padding:9px;background:#1c304a;color:white}button{cursor:pointer}button.active,.primary{background:#16a4b6;color:#06151e;border-color:#16a4b6;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{background:#14243a;border:1px solid #30435e;border-radius:12px;padding:15px;margin:10px 0}.stats strong{font-size:27px;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.tag{padding:4px 8px;border-radius:20px;background:#30445d;font-size:12px}.warning{color:#ffd17b}.ok{color:#85e3ae}h2{font-size:20px}label{display:block;font-size:13px;margin:8px 0}input,textarea{width:100%}select{max-width:100%}.item{border-bottom:1px solid #30435e;padding:12px 0}.item:last-child{border:0}.item h3{font-size:16px;margin:4px 0}.item p{margin:5px 0;color:#b7c9da;font-size:13px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.danger{border-color:#a44d5a;color:#ffb0b0}@media(max-width:600px){header{padding:16px}main{padding:10px}.row{align-items:stretch}}</style><header><h1>FICON <span style="color:#5be1ee">2026</span> · Centro de control</h1><small>FEVAL · 21–23 octubre · Coordinación técnica y audiovisual</small></header><main><div class="stats" id="stats"></div><nav id="nav"></nav><section id="view"></section><p class="muted">Datos guardados únicamente en este navegador. No hay sincronización ni notificaciones con la página cerrada. Los estados iniciales no acreditan entregas ni pruebas.</p></main><script>
const events=[
['21','10:00','Conferencias','Inauguración oficial'],['21','11:30','Conferencias','El cimiento invisible'],['21','15:45','Conferencias','Café institucional'],['21','16:30','Conferencias','Digitalización de la construcción'],['21','17:30','Conferencias','Prevención de riesgos laborales'],['22','09:00','Auditorio','Inauguración Tour Formación y Empleo'],['22','09:00','Zona autobús','Inauguración Tour Construye 2030plus'],['22','10:00','Conferencias','ASINET: Tu oficio, tu futuro'],['22','11:00','Junta','FacilitaEx · AGENEX'],['22','11:45','Junta','CREEX · Normatia'],['22','12:15','Junta','Comunidades energéticas y CAE'],['22','13:00','Junta','Empresa y educación, cara a cara'],['23','09:00','FEVAL','Desayuno networking'],['23','10:00','Conferencias','Industrialización de la vivienda'],['23','10:00','Junta','ASINET: Apertura jornadas'],['23','10:30','Junta','IDE · Portal Gea'],['23','11:15','Conferencias','El equipo invisible de una vivienda'],['23','12:00','Junta','Toscano · Novedades del Reglamento'],['23','12:30','Conferencias','Simplificación de trámites'],['23','13:00','Junta','ASAL · Obligaciones digitales'],['23','13:30','Conferencias','Clausura de la feria']];
const equipment=[
['Conferencias','Atril metacrilato','FEVAL',1],['Conferencias','JBL EON 700','FEVAL',6],['Conferencias','Micrófonos de mano inalámbricos','FEVAL',2],['Conferencias','Pantalla LED (dos opciones)','Solo Música',1],['Conferencias','Micrófonos diadema','Solo Música',5],['Conferencias','Equipo de sonido e imagen','Solo Música',1],['Conferencias','Pasador diapositivas','Solo Música',1],
['Junta','Atril madera (día 23)','FEVAL',1],['Junta','Pantalla desplegable','Solo Música',1],['Junta','Proyector','Solo Música',1],['Junta','Micrófonos diadema','Solo Música',4],['Junta','Equipo de sonido e imagen','Solo Música',1],['Junta','Pasador diapositivas','Solo Música',1],
['Hall','Atril cedido por Ayuntamiento','FEVAL',1],['Hall','Equipo para inauguración','FEVAL',1],
['Auditorio','Atril madera','FEVAL',1],['Auditorio','Proyector','FEVAL',1],['Auditorio','Micrófonos diadema','FEVAL',1],['Auditorio','Pasador diapositivas','Solo Música',1]];
const tasks=['Solicitar y confirmar presupuesto Solo Música','Confirmar número de técnicos y horas por espacio','Verificar recepción y montaje de material','Probar sonido y micrófonos por espacio','Probar imagen, pantallas y proyectores','Recibir presentaciones de cada ponencia','Probar presentaciones y pasadores','Confirmar necesidades de inauguración','Verificar simultaneidad de sesiones','Revisar desmontaje y devoluciones'];
const base={events:events.map((a,i)=>({id:'e'+i,day:a[0],time:a[1],space:a[2],name:a[3],status:'Sin verificar',slides:'Sin verificar',notes:''})),equipment:equipment.map((a,i)=>({id:'m'+i,space:a[0],name:a[1],owner:a[2],qty:a[3],status:'Sin verificar',notes:''})),tasks:tasks.map((name,i)=>({id:'t'+i,name,status:'Pendiente',space:'General',notes:''})),incidents:[]};
let db;try{db=JSON.parse(localStorage.getItem('ficon26-data'))||structuredClone(base)}catch{db=structuredClone(base)}
// Actualización operativa del 20/10/2026: confirmaciones de Sala de Conferencias.
// Solo se aplica automáticamente a registros que aún estén sin verificar.
const revision='conferencias-2026-10-20-v1';
if(!localStorage.getItem(revision)){
 const updates={
 'm0':{status:'Instalado',notes:'Atril montado en principio; pendiente de confirmación de Solo Música.'},
 'm1':{qty:4,status:'Instalado',notes:'Cambio de 6 a 4 JBL. Montaje a cargo de Solo Música; aparentemente montados, sin confirmación técnica.'},
 'm2':{status:'Recibido',notes:'Los 2 micrófonos de mano se han entregado a Solo Música. No consta montaje ni prueba.'},
 'm3':{status:'Confirmado',notes:'Opción de pantalla LED elegida: aproximadamente 3,5 × 2 m; dimensiones por confirmar. No consta entrega, montaje ni prueba.'},
 'm4':{status:'Sin verificar',notes:'Los 5 micrófonos de diadema corresponden a Solo Música; entrega y montaje pendientes de confirmar.'},
 'm5':{status:'Instalado',notes:'Equipo de sonido e imagen montado; pruebas y funcionamiento sin confirmar.'},
 'm6':{status:'Recibido',notes:'Pasador de diapositivas entregado; montaje/prueba no confirmados.'}
 };
 for(const o of db.equipment){const u=updates[o.id];if(u){if(o.status==='Sin verificar'){o.status=u.status;if(u.qty)o.qty=u.qty}if(!o.notes)o.notes=u.notes}}
 localStorage.setItem('ficon26-data',JSON.stringify(db));
 localStorage.setItem(revision,'1');
}

const juntaRevision='junta-2026-10-20-v1';
if(!localStorage.getItem(juntaRevision)){
 const u={
 m7:{status:'Sin verificar',notes:'Atril de madera para día 23. No se sabe si está montado ni si dispone de micrófono.'},
 m8:{name:'Televisor de 100 pulgadas (sustituye pantalla desplegable)',status:'Instalado',notes:'Televisor de 100 pulgadas montado. Sustituye pantalla desplegable.'},
 m9:{name:'Proyector (cancelado por televisor de 100 pulgadas)',status:'No disponible',notes:'No es necesario; se utiliza televisor de 100 pulgadas. No es una falta de entrega.'},
 m10:{status:'Sin verificar',notes:'4 micrófonos de diadema de Solo Música. Se cree que están, sin confirmación.'},
 m11:{status:'Sin verificar',notes:'Equipo de sonido e imagen de Solo Música. Se cree que está, sin confirmación.'},
 m12:{status:'Solicitado',notes:'Pasador de diapositivas FEVAL pendiente de entregar a Solo Música / espacio Junta.'}
 };
 for(const o of db.equipment){if(u[o.id]){const v=u[o.id];if(o.status==='Sin verificar')o.status=v.status;if(v.name)o.name=v.name;o.notes=o.notes?o.notes+' | '+v.notes:v.notes}}
 const additions=[
 ['Ordenador FEVAL','Pendiente de entregar ordenador con HDMI, alimentación y ratón'],
 ['Cable HDMI para ordenador','Pendiente de entregar junto con ordenador'],
 ['Alimentación del ordenador','Pendiente de entregar junto con ordenador'],
 ['Ratón para ordenador','Pendiente de entregar junto con ordenador'],
 ['Micrófono del atril','Se desconoce si el atril dispone de micrófono; verificar necesidad']
 ];
 for(let i=0;i<additions.length;i++){const id='junta-extra-'+i;if(!db.equipment.some(x=>x.id===id))db.equipment.push({id,space:'Junta',name:additions[i][0],owner:'FEVAL',qty:1,status:i===4?'Sin verificar':'Solicitado',notes:additions[i][1]})}
 localStorage.setItem('ficon26-data',JSON.stringify(db));localStorage.setItem(juntaRevision,'1');
}

const hallRevision='hall-2026-10-20-v1';
if(!localStorage.getItem(hallRevision)){
 const u={
 m13:{status:'Recibido',notes:'Atril cedido por Ayuntamiento disponible en Hall; montaje no confirmado.'},
 m14:{status:'Recibido',notes:'Equipo de sonido disponible. Pendiente de montaje previsto para el 22 de octubre.'}
 };
 for(const o of db.equipment){if(u[o.id]){if(o.status==='Sin verificar')o.status=u[o.id].status;o.notes=o.notes?o.notes+' | '+u[o.id].notes:u[o.id].notes}}
 if(!db.equipment.some(x=>x.id==='hall-microfonos'))db.equipment.push({id:'hall-microfonos',space:'Hall',name:'1 o 2 micrófonos para atril',owner:'FEVAL',qty:2,status:'Solicitado',notes:'Pendiente determinar si se necesita uno o dos. Alternativa: tomar micrófono de recepción o sala de prensa; comprobar disponibilidad y traslado.'});
 for(const [id,name] of [['hall-montaje-22','Montar equipo de sonido del Hall el 22 de octubre'],['hall-decidir-micro','Confirmar 1 o 2 micrófonos para el atril del Hall y su procedencia']])if(!db.tasks.some(x=>x.id===id))db.tasks.push({id,name,status:'Pendiente',space:'Hall',notes:''});
 localStorage.setItem('ficon26-data',JSON.stringify(db));localStorage.setItem(hallRevision,'1');
}

const audRevision='auditorio-2026-10-20-v1';
if(!localStorage.getItem(audRevision)){
 const u={
 m15:{status:'Sin verificar',notes:'Atril de madera ubicado en el espacio de la Junta. Verificar si debe trasladarse al Auditorio y coordinar uso compartido.'},
 m16:{status:'Sin verificar',notes:'Proyector habitual de FEVAL para Auditorio. Montaje y revisión comienzan el 21 de octubre.'},
 m17:{qty:2,status:'Solicitado',notes:'Dos micrófonos disponibles en FEVAL pendientes de entregar a Solo Música. Tipo exacto por verificar.'},
 m18:{owner:'FEVAL',status:'Solicitado',notes:'Pasador de diapositivas disponible en FEVAL, pendiente de entregar a Solo Música.'}
 };
 for(const o of db.equipment){if(u[o.id]){const v=u[o.id];if(o.status==='Sin verificar')o.status=v.status;if(v.qty)o.qty=v.qty;if(v.owner)o.owner=v.owner;o.notes=o.notes?o.notes+' | '+v.notes:v.notes}}
 if(!db.equipment.some(x=>x.id==='aud-ordenador'))db.equipment.push({id:'aud-ordenador',space:'Auditorio',name:'Ordenador FEVAL para Auditorio',owner:'FEVAL',qty:1,status:'Solicitado',notes:'Disponible en FEVAL; pendiente de entregar a Solo Música.'});
 for(const [id,name] of [['aud-montaje-21','Comenzar montaje y revisión del Auditorio el 21 de octubre'],['aud-entrega','Entregar a Solo Música 2 micrófonos, ordenador y pasador para Auditorio'],['aud-atril','Verificar traslado o disponibilidad compartida del atril entre Junta y Auditorio'],['aud-conexiones','Revisar cables HDMI, alimentación y adaptadores del Auditorio']])if(!db.tasks.some(x=>x.id===id))db.tasks.push({id,name,status:'Pendiente',space:'Auditorio',notes:''});
 localStorage.setItem('ficon26-data',JSON.stringify(db));localStorage.setItem(audRevision,'1');
}

const atrilRevision='atril-compartido-2026-10-20-v1';
if(!localStorage.getItem(atrilRevision)){
 const junta=db.equipment.find(x=>x.id==='m7'),aud=db.equipment.find(x=>x.id==='m15');
 const msg='CONFIRMADO: es el MISMO atril físico de madera para el espacio Junta y Auditorio. Ubicación actual comunicada: Junta. Coordinar traslado y horarios; no contar como dos unidades.';
 if(junta){junta.notes=(junta.notes?junta.notes+' | ':'')+msg}
 if(aud){aud.notes=(aud.notes?aud.notes+' | ':'')+msg;aud.qty=0;aud.name='Uso compartido del atril de madera de Junta (no es otro equipo)'}
 const task=db.tasks.find(x=>x.id==='aud-atril');if(task){task.notes='Confirmado: un solo atril compartido; comprobar horas y traslado antes de usarlo en Auditorio.'}
 localStorage.setItem('ficon26-data',JSON.stringify(db));localStorage.setItem(atrilRevision,'1');
}
let tab='Resumen',day='Todos',search='';
const states=['Sin verificar','Solicitado','Confirmado','Recibido','Instalado','Probado','Finalizado','No disponible'],taskStates=['Pendiente','En curso','Bloqueado','Finalizado'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('ficon26-data',JSON.stringify(db));render()}
function set(kind,id,key,val){let o=db[kind].find(x=>x.id===id);if(o){o[key]=val;save()}}
function opts(arr,v){return arr.map(s=>'<option '+(s===v?'selected':'')+'>'+esc(s)+'</option>').join('')}
function control(kind,o,key,arr){return '<select aria-label="'+key+'" onchange="set(\''+kind+'\',\''+o.id+'\',\''+key+'\',this.value)">'+opts(arr,o[key])+'</select>'}
function note(kind,o){return '<details><summary>Notas / responsable</summary><textarea rows="2" onchange="set(\''+kind+'\',\''+o.id+'\',\'notes\',this.value)">'+esc(o.notes)+'</textarea></details>'}
function item(kind,o){let e=kind==='events',m=kind==='equipment';return '<article class="item"><div class="row"><div class="grow"><span class="tag">'+esc(e?'Día '+o.day+' · '+o.time+' · '+o.space:m?o.space+' · '+o.owner:'Tarea')+'</span><h3>'+esc(o.name)+'</h3>'+(m?'<p>Cantidad: '+o.qty+'</p>':'')+'</div>'+control(kind,o,'status',kind==='tasks'?taskStates:states)+'</div>'+(e?'<div class="row"><span class="muted">Presentación:</span>'+control(kind,o,'slides',states)+'</div>':'')+note(kind,o)+'</article>'}
function render(){const all=[...db.events,...db.equipment,...db.tasks],done=all.filter(x=>x.status==='Finalizado').length,pending=all.length-done,slides=db.events.filter(x=>x.slides!=='Recibido'&&x.slides!=='Probado'&&x.slides!=='Finalizado').length;document.getElementById('stats').innerHTML=[['Actividades',db.events.length],['Equipos',db.equipment.length],['Tareas',db.tasks.length],['Sin finalizar',pending],['Presentaciones por verificar',slides],['Incidencias',db.incidents.length]].map(([a,b])=>'<div class="card"><small>'+a+'</small><strong>'+b+'</strong></div>').join('');document.getElementById('nav').innerHTML=['Resumen','Agenda','Material','Tareas','Incidencias','Datos'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>').join('');let h='';
if(tab==='Resumen'){h='<h2>Control operativo</h2><div class="card"><b class="warning">Pendiente de verificar</b><p>Los elementos cargados proceden del programa oficial y del listado de necesidades audiovisuales. La app no presume que se haya entregado, instalado o probado nada.</p></div><div class="two"><div class="card"><h3>Próximas comprobaciones</h3>'+db.tasks.filter(x=>x.status!=='Finalizado').slice(0,8).map(x=>'<p>• '+esc(x.name)+' — '+esc(x.status)+'</p>').join('')+'</div><div class="card"><h3>Charlas y presentaciones</h3><p>'+slides+' actividades sin presentación verificada.</p><p>Comprueba también ponentes, pruebas de audio, vídeo y horarios de cada espacio.</p></div></div>'}
if(['Agenda','Material','Tareas'].includes(tab)){let kind={Agenda:'events',Material:'equipment',Tareas:'tasks'}[tab];h='<div class="row"><h2 class="grow">'+tab+'</h2><select onchange="day=this.value;render()">'+opts(['Todos','21','22','23'],day)+'</select></div><input placeholder="Buscar actividad, material, espacio..." value="'+esc(search)+'" oninput="search=this.value;render()"><div class="card">'+db[kind].filter(o=>(day==='Todos'||(kind==='events'&&o.day===day))&&JSON.stringify(o).toLowerCase().includes(search.toLowerCase())).map(o=>item(kind,o)).join('')+'</div>';if(tab==='Tareas')h+='<div class="card"><h3>Nueva tarea</h3><input id="newtask" placeholder="Descripción de tarea"><button class="primary" onclick="addTask()">Añadir tarea</button></div>'}
if(tab==='Incidencias'){h='<h2>Registro de incidencias</h2><div class="card"><input id="incname" placeholder="Incidencia"><input id="incspace" placeholder="Espacio / responsable"><button class="primary" onclick="addIncident()">Registrar incidencia</button></div><div class="card">'+db.incidents.map(o=>'<article class="item"><h3>'+esc(o.name)+'</h3><p>'+esc(o.space)+'</p>'+control('incidents',o,'status',taskStates)+note('incidents',o)+'</article>').join('')+'</div>'}
if(tab==='Datos')h='<h2>Copias de seguridad</h2><div class="card"><p>Exporta tus cambios a un JSON e impórtalo cuando cambies de dispositivo. La URL por sí sola no sincroniza datos.</p><button class="primary" onclick="backup()">Exportar JSON</button> <label>Importar copia<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label><button class="danger" onclick="if(confirm(\'¿Borrar cambios locales?\')){db=structuredClone(base);save()}">Restablecer datos iniciales</button></div>';document.getElementById('view').innerHTML=h}
function addTask(){let v=document.getElementById('newtask').value.trim();if(v){db.tasks.push({id:'t'+Date.now(),name:v,status:'Pendiente',space:'General',notes:''});save()}}
function addIncident(){let name=document.getElementById('incname').value.trim(),space=document.getElementById('incspace').value.trim();if(name){db.incidents.push({id:'i'+Date.now(),name,space,status:'Pendiente',notes:''});save()}}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='ficon-2026-copia.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function restore(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.events)||!Array.isArray(d.equipment)||!Array.isArray(d.tasks)||!Array.isArray(d.incidents))throw Error();db=d;save()}catch{alert('Archivo no válido')}}
render();</script></html>
